    <script>
      (function() {
        var isCrossOriginError = function(err) {
          var str = String((err && (err.message || err.reason || err.error)) || err || '');
          return str.indexOf('$$typeof') !== -1 ||
                 str.indexOf('SecurityError') !== -1 ||
                 str.indexOf('Blocked a frame') !== -1 ||
                 str.indexOf('cross-origin') !== -1;
        };

        window.onerror = function(msg, url, line, col, error) {
          if (isCrossOriginError(msg) || isCrossOriginError(error)) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (isCrossOriginError(event.message) || isCrossOriginError(event.error) || isCrossOriginError(event)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isCrossOriginError(event.reason) || isCrossOriginError(event)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
